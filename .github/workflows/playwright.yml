name: QA Playground Bank

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Select project to run'
        required: true
        default: 'ui'
        type: choice
        options:
          - ui
          - api
          - migration

      environment:
        description: 'Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - uat

      suite:
        description: 'Test suite'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  automation-tests:

    timeout-minutes: 60

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run automation
        run: npm run cli -- ${{ inputs.project }} --env ${{ inputs.environment }} --suite ${{ inputs.suite }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          