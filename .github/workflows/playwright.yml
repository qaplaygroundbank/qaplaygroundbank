name: QA Playground Bank

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Select project to run'
        required: true
        default: 'securebank'
        type: choice
        options:
          - securebank
          - parabank
          - api

      suite:
        description: 'Test suite'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  automation-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ inputs.project == 'securebank' || inputs.project == 'parabank' }}
        run: npx playwright install --with-deps

      - name: Run automation
        run: npm run cli -- ${{ inputs.project }} --env qa --suite ${{ inputs.suite }}
        env:
          QA_PLAYGROUND_ENV: qa
          UI_QA_USERNAME: ${{ inputs.project == 'securebank' && secrets.UI_QA_USERNAME || inputs.project == 'parabank' && secrets.PARABANK_QA_USERNAME || '' }}
          UI_QA_PASSWORD: ${{ inputs.project == 'securebank' && secrets.UI_QA_PASSWORD || inputs.project == 'parabank' && secrets.PARABANK_QA_PASSWORD || '' }}

      - name: Upload SecureBank or API report
        if: ${{ !cancelled() && inputs.project != 'parabank' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-report
          path: reports/${{ inputs.project }}/qa/${{ inputs.suite }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ParaBank report
        if: ${{ !cancelled() && inputs.project == 'parabank' }}
        uses: actions/upload-artifact@v4
        with:
          name: parabank-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
